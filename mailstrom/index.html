<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the page paint under the notch so the safe-area
      insets in index.css have something to work with.
      user-scalable=no is deliberately NOT set — pinch zoom is an accessibility
      feature and iOS 10+ ignores attempts to disable it anyway.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Clean up your Gmail inbox in bulk, from your phone." />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1114" media="(prefers-color-scheme: dark)" />

    <!-- iOS home-screen behaviour -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mailstrom" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Google Identity Services is loaded on demand by src/lib/auth.ts -->
    <link rel="preconnect" href="https://accounts.google.com" />
    <link rel="preconnect" href="https://gmail.googleapis.com" />

    <title>Mailstrom</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
