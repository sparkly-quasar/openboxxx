    <rect x="120" y="150" width="272" height="186" rx="26" stroke-width="26"/>
    <path d="M138 178 L256 268 L374 178" stroke-width="26"/>
  </g>
  <g fill="none" stroke="#fff" stroke-linecap="round" opacity="0.92">
    <path d="M96 380 H300" stroke-width="22"/>
    <path d="M150 424 H330" stroke-width="18" opacity="0.7"/>
  </g>
</svg>
